<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>UGLY SEXY</title>
  <meta property="og:title" content="UGLY SEXY">
  <meta property="og:image" content="https://uglysexy.com/og.png">
  <meta property="og:url" content="https://uglysexy.com">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #111; --bg: #fff; --soft: #f2f2f2; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font: 400 15px/1.4 "Tinos", "Times New Roman", serif; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    a { color: inherit; }

    /* Entrada: negro que se va a blanco, y aparece el logo */
    #fade { position: fixed; inset: 0; z-index: 50; background: #000; pointer-events: none;
      animation: fadeout 3s ease-in-out .3s forwards; }
    @keyframes fadeout { to { opacity: 0; visibility: hidden; } }

    #logo { display: block; opacity: 0; animation: appear 1.8s ease 1.6s forwards; }
    #logo img { width: min(420px, 70vw); height: auto; display: block; transition: transform .25s ease; }
    @media (hover: hover) { #logo:hover img { transform: scale(1.03); } }
    @keyframes appear { to { opacity: 1; } }

    /* Menú superior (aparece al dar play) */
    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 30;
      padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      column-gap: clamp(16px, 20vw - 34px, 240px);  /* mismo espacio a cada lado de fechas */
      font-size: 19px; letter-spacing: .2em; opacity: 0; filter: blur(10px); pointer-events: none;
      transition: opacity 1.8s ease, filter 1.8s ease; }
    nav button { padding: 8px; }  /* área de toque más grande */
    nav button:nth-child(1) { justify-self: end; }
    nav button:nth-child(3) { justify-self: start; }
    nav button[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 5px; }
    body.started nav { opacity: 1; filter: blur(0); pointer-events: auto; }

    /* Secciones: pantalla blanca con el contenido al centro */
    .panel { position: fixed; inset: 0; z-index: 20; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; padding: 80px 16px; text-align: center; letter-spacing: .2em;
      opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility .35s; }
    .panel.open { opacity: 1; visibility: visible; }
    .panel .big { font-size: 26px; letter-spacing: .3em; }
    .panel .label { font-size: 13px; opacity: .5; margin-top: 18px; }
    .panel .label:first-child { margin-top: 0; }
    .panel a { text-decoration: none; border-bottom: 1px solid currentColor; }

    /* Reproductor */
    #player { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 160%);
      width: min(380px, calc(100vw - 32px)); height: 44px; padding: 0 16px; gap: 12px;
      display: flex; align-items: center;
      transition: transform .5s ease; }
    body.started #player { transform: translate(-50%, 0); }
    #toggle svg { width: 14px; display: block; }
    #time { white-space: nowrap; font-variant-numeric: tabular-nums; font-size: 13px; }
    #bar { flex: 1; height: 32px; display: flex; align-items: center; cursor: pointer; }
    #bar div { height: 3px; width: 100%; background: #ccc; border-radius: 2px; overflow: hidden; }
    #bar span { display: block; height: 100%; width: 0; background: var(--ink); }
    #vol { width: 56px; accent-color: var(--ink); }
    @media (max-width: 420px) { #vol { display: none; } .panel .big { font-size: 18px; letter-spacing: .2em; } nav { font-size: 15px; letter-spacing: .15em; padding-left: 8px; padding-right: 8px; } nav button { padding: 8px 6px; } }

    /* Si el navegador bloquea el play (iPhone a veces), mostramos el reproductor de Mixcloud */
    #mc { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 30; transform: translateX(-50%);
      width: min(380px, calc(100vw - 32px)); height: 60px; border: 0;
      opacity: 0; pointer-events: none; }
    #mc.fallback { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="fade"></div>

  <nav>
    <button data-panel="tienda" aria-pressed="false">tienda</button>
    <button data-panel="fechas" aria-pressed="false">fechas</button>
    <button data-panel="contacto" aria-pressed="false">contacto</button>
  </nav>

  <button id="logo" aria-label="Reproducir el mix"><img src="logo.svg" alt="UGS — ugly sexy"></button>

  <section class="panel" id="tienda">
    <p class="big">pronto</p>
  </section>

  <section class="panel" id="fechas">
    <p class="big">26 de noviembre</p>
    <p>radelica</p>
    <p class="label">lanzamiento tienda</p>
  </section>

  <section class="panel" id="contacto">
    <p class="label">booking</p>
    <p><a href="mailto:business@uglysexy.com">business@uglysexy.com</a></p>
    <p class="label">instagram</p>
    <p><a href="https://www.instagram.com/uglysexyfanpage/" target="_blank" rel="noopener">@uglysexyfanpage</a></p>
  </section>

  <div id="player" aria-label="Reproductor">
    <button id="toggle" aria-label="Play"></button>
    <span id="time">0:00 / 0:00</span>
    <div id="bar" role="slider" aria-label="Avance"><div><span></span></div></div>
    <input id="vol" type="range" min="0" max="100" value="100" aria-label="Volumen">
  </div>

  <iframe id="mc" allow="autoplay; encrypted-media" title="Mix en Mixcloud"></iframe>

  <script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>
  <script>
    // ⬇️ Mix en Mixcloud (la parte después de mixcloud.com)
    const MIX = "/uglysexy/duum-release-house-party/";

    const $ = (id) => document.getElementById(id);
    const ICON_PLAY = '<svg viewBox="0 0 24 28"><path d="M0 0 24 14 0 28z" fill="currentColor"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 24 28"><path d="M0 0h8v28H0zM16 0h8v28h-8z" fill="currentColor"/></svg>';
    const fmt = (sec) => { const s = Math.floor(sec), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = String(s % 60).padStart(2, "0");
      return h ? `${h}:${String(m).padStart(2, "0")}:${r}` : `${m}:${r}`; };

    const iframe = $("mc");
    iframe.src = "https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&light=1&hide_artwork=1&disable_unload_warning=1&feed=" + encodeURIComponent(MIX);
    const w = Mixcloud.PlayerWidget(iframe);
    let ready = false, wantPlay = false, duration = 0, playing = false;

    const setIcon = () => {
      $("toggle").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
      $("toggle").ariaLabel = $("logo").ariaLabel = playing ? "Pausar el mix" : "Reproducir el mix";
    };
    setIcon();

    const start = () => {
      document.body.classList.add("started");
      if (!ready) { wantPlay = true; return; }   // aún cargando: parte apenas esté listo
      w.play();
      setTimeout(() => { if (!playing) iframe.classList.add("fallback"); }, 2500);
    };

    w.ready.then(() => {
      ready = true;
      w.getDuration().then((d) => { duration = d; $("time").textContent = `0:00 / ${fmt(d)}`; });
      if (typeof w.setVolume !== "function") $("vol").remove();
      w.events.play.on(() => { playing = true; setIcon(); iframe.classList.remove("fallback"); });
      w.events.pause.on(() => { playing = false; setIcon(); });
      w.events.ended.on(() => { playing = false; setIcon(); });
      w.events.progress.on((pos, dur) => {
        if (dur) duration = dur;
        if (!duration) return;
        $("time").textContent = `${fmt(pos)} / ${fmt(duration)}`;
        $("bar").querySelector("span").style.width = (pos / duration * 100) + "%";
      });
      if (wantPlay) start();
    });

    // Logo: el primer click pone la música; después pausa / reanuda
    $("logo").onclick = () => document.body.classList.contains("started") && ready ? w.togglePlay() : start();
    $("toggle").onclick = () => ready && w.togglePlay();
    $("bar").onclick = (e) => { if (!duration) return; const r = e.currentTarget.getBoundingClientRect(); w.seek((e.clientX - r.left) / r.width * duration); };
    $("vol").oninput = (e) => w.setVolume && w.setVolume(e.target.value / 100);

    // Menú: abre/cierra cada sección; click en el fondo o Esc vuelve al logo
    const navBtns = document.querySelectorAll("nav button");
    const openPanel = (id) => {
      document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("open", p.id === id));
      navBtns.forEach((b) => b.setAttribute("aria-pressed", b.dataset.panel === id));
    };
    navBtns.forEach((b) => b.onclick = () => openPanel(b.getAttribute("aria-pressed") === "true" ? null : b.dataset.panel));
    document.querySelectorAll(".panel").forEach((p) => p.onclick = (e) => { if (!e.target.closest("a")) openPanel(null); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") openPanel(null); });
  </script>
</body>
</html>
